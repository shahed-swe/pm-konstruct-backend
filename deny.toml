# cargo-deny: dependency policy. Runs in CI as a required check.
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# Add an entry only with a dated comment explaining why it is acceptable here.
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
         "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# rustls only: OpenSSL in a container means tracking CVEs in a C dependency.
deny = [{ name = "openssl-sys", reason = "use rustls; see Architecture 1" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
